const D={j:{n:"Jasmine",av:"+",st:"someone who truly matters",hm:"Welcome, Jasmine. A universe built just for you.",me:[{t:"We Laughed Until We Cried",d:"still makes me smile",i:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&h=300&fit=crop",c:"Pure gold."},{t:"Late Night Conversations",d:"time didn't matter",i:"https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=400&h=300&fit=crop",c:"Everything and nothing."}],lt:"For You, Jasmine",lc:"Dear Jasmine,\n\nYou make people feel seen. Remembering details others forget, showing up when it matters. That's rare.\n\nThis bond matters. Trust, laughter, understanding.\n\nThank you for being you.\n\nWith appreciation,\nSomeone who values you",ga:["https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&h=500&fit=crop"],so:[{t:"She Goes By",a:"Special Song"}],sm:"Jasmine, you make the world softer. Never forget how much you matter."},e:{n:"Ella",av:"+",st:"worth every second of waiting",hm:"A secret place, Ella. No pressure. Just someone who sees you.",me:[{t:"First Time We Talked",d:"you were different",i:"https://images.unsplash.com/photo-1514315384763-ba401779410f?w=400&h=300&fit=crop",c:"Some people stand out."},{t:"Your Smile",d:"even on hard days",i:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=300&fit=crop",c:"You still smile."}],lt:"For You, Ella",lc:"Dear Ella,\n\nI'm not here to rush you. Just here. Patiently.\n\nHealing isn't linear. That's okay.\n\nTake your time. No pressure.\n\nWhenever you're ready, I'll be here.\n\nYours patiently,\nSomeone who sees your worth",ga:["https://images.unsplash.com/photo-1514315384763-ba401779410f?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&h=500&fit=crop"],so:[{t:"Patient Heart",a:"For Ella"}],sm:"Ella, healing isn't linear. Take your time. I care. No pressure. Ever."},p:{n:"My Princess",av:"+",avImg:"https://cdn.kord.live/serve/dvYw2S5YqKjC.jpg",st:"worth crossing any distance for",hm:"You said show you. Here it is. A universe built for you.",me:[{t:"First Time I Saw You",d:"i just knew",i:"https://cdn.kord.live/serve/dvYw2S5YqKjC.jpg",c:"Your face stayed."},{t:"Song I Sang For You",d:"every word real",i:"https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=300&fit=crop",c:"Words weren't enough."}],lt:"The Letter",lc:"To My Princess,\n\nYou said show you I really want you. So here it is. A whole universe. For you.\n\nYou're worth every mile. Every call. Every song.\n\nI don't just want a girlfriend. I want you.\n\nBe my girlfriend? Not because I asked. Because I proved it.\n\nYours,\nThe one who sang for you",ga:["https://cdn.kord.live/serve/dvYw2S5YqKjC.jpg","https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400&h=500&fit=crop"],so:[{t:"Song I Sang For You",a:"Every word for you",url:"https://cdn.kord.live/serve/YlGrqoBsczBb.opus"}],sm:"You're why I built this. Why I sang. Be my princess. For real. Always."},w:{n:"My Wifey",av:"+",avImg:"https://files.catbox.moe/gj8or3.jpeg",avGlow:"0 0 40px rgba(255,215,0,0.4)",st:"she said yes, the universe shifted",hm:"<span class='badge'>HUSBAND</span> <span class='badge'>WIFEY</span><br><br>You already call me husband. I already call you wifey. This is our world. No regrets, just us.",me:[{t:"When You Said Yes",d:"everything changed",i:"https://files.catbox.moe/gj8or3.jpeg",c:"You didn't just say yes to me. You said yes to us."},{t:"The Way You Call Me Husband",d:"and I call you wifey",i:"https://files.catbox.moe/aez7zy.jpeg",c:"Every time you say it, I know I made the right choice."},{t:"Your Laugh",d:"the sound I want forever",i:"https://files.catbox.moe/8x858e.jpeg",c:"If I could bottle one sound, it would be that."},{t:"Us Against Everything",d:"no looking back",i:"https://files.catbox.moe/fzjt9z.jpeg",c:"You and me. That's the plan."}],lt:"To My Wifey",lc:"My wifey,\n\nYou called me husband before I even asked. And when I did ask, you said yes like you'd been waiting for me to catch up. That energy, I'm never letting go.\n\nYou're not going to regret this. Not today, not years from now. I chose you because of how you make me feel. Seen. Wanted. At home.\n\nYour texts, your voice, the way you say my name. It all hits different with you.\n\nThis is mutual. This is real. Husband and wifey against whatever comes.\n\nForever your husband,\nRem",ga:["https://files.catbox.moe/gj8or3.jpeg","https://files.catbox.moe/aez7zy.jpeg","https://files.catbox.moe/8x858e.jpeg","https://files.catbox.moe/fzjt9z.jpeg"],so:[{t:"Song I Sang For My Wifey",a:"Every note is yours",url:"https://files.catbox.moe/o5q5qx.mp4",vid:true}],sm:"Wifey. You said yes. You call me husband. I meant every word. I've got you. Always."},s:{n:"Shammah",av:"+",st:"a queen with heaven's glow",hm:"<span class='badge'>SHAMMAH</span><br><br>You're different. You carry yourself like you know whose you are. And that's exactly why I can't stop thinking about you.",me:[{t:"The First Time I Noticed You",d:"real recognizes real",i:"https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=300&fit=crop",c:"You stood out. Not because you were trying to. Because you couldn't help it."},{t:"Your Faith",d:"the most attractive thing",i:"https://images.unsplash.com/photo-1504052432859-70e60d1b6a72?w=400&h=300&fit=crop",c:"A woman who loves God first. That's rare. That's priceless."},{t:"The Way You Talk",d:"grace in every word",i:"https://images.unsplash.com/photo-1493723843671-1d655e66ac1c?w=400&h=300&fit=crop",c:"Wisdom most people twice your age haven't found."},{t:"That Smile Though",d:"yeah, that one",i:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=300&fit=crop",c:"Just keep smiling like that."}],lt:"A Letter For Shammah",lc:"Shammah,\n\nI'm going to be straight with you because you deserve that. No games, no gimmicks. Just honesty.\n\nI like you. I've liked you for a minute now and I can't keep pretending it's just casual. Every time I see you, every time your name pops up, every time you laugh at something I said, something in me just clicks.\n\nYou're not like most girls. You walk different when you know your worth. You talk different when you know who made you. There's a peace around you that doesn't come from this world and that's the most attractive thing about you.\n\nI know you have your guard up. I respect that. A woman like you should be pursued properly, prayed over and not just chased. I'm not trying to skip steps. I'm just being honest about what I feel.\n\nWhat I want is a chance. Actions speak louder than words and I'd rather show you who I am over time than tell you in one conversation.\n\nI see someone who puts God first. Someone who carries herself with grace and strength. Someone who deserves the kind of love in 1 Corinthians 13. Not watered down. The real thing.\n\nI want to know what makes you laugh when no one's watching. What songs you play when you're in your feelings. What verses you go back to when life gets heavy. What dreams you've whispered to God that you haven't told anyone else.\n\nI want to be someone who adds to your peace. Someone who pushes you closer to God. Someone who sees the queen in you and treats you accordingly.\n\nSo here I am, Shammah. Not with a fancy speech. Just with honesty and a genuine heart. I'm asking you to be my girlfriend. Not because I'm trying to rush you. But because I know what I want. And I want you.\n\nSo what do you say? Will you give me that chance? Will you be mine?\n\nGo to the next page and let me know your answer.\n\nWith all sincerity,\nSomeone who sees your worth",ga:["https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1504052432859-70e60d1b6a72?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1493723843671-1d655e66ac1c?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=500&fit=crop"],so:[{t:"For Shammah",a:"A song in my heart"},{t:"Worth the Wait",a:"Patience and faith"},{t:"Heaven Sent",a:"That's what you are"}],sm:"Shammah. Proverbs 31:10 says a wife of noble character is worth more than rubies. You're worth more than that. I see you. I'm serious about you."},f:{n:"Lory",av:"+",st:"some people never really leave you",hm:"<span class='badge'>FAVOUR</span> <span class='anon-badge'>ANONYMOUS</span><br><br>You probably don't think about me anymore. But I still think about you. Every day. And I needed to say this somewhere.",me:[{t:"When We Were Us",d:"before everything changed",i:"https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&h=300&fit=crop",c:"There was a time when your name in my phone felt like home."},{t:"The Little Things",d:"that I still remember",i:"https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400&h=300&fit=crop",c:"The way you laughed. How you said my name. Things I didn't know I'd miss this much."},{t:"Months Later",d:"and you're still here",i:"https://images.unsplash.com/photo-1493723843671-1d655e66ac1c?w=400&h=300&fit=crop",c:"Not physically. But in my head. In my chest. In every song."},{t:"I Hope You're Okay",d:"genuinely",i:"https://images.unsplash.com/photo-1504052432859-70e60d1b6a72?w=400&h=300&fit=crop",c:"Even if you never read this. Even if you've moved on. I just hope you're happy."}],lt:"To Favour, Wherever You Are",lc:"Lory,\n\nI don't know if you'll ever see this. Maybe that's the point. Maybe I just needed somewhere to put these words that have been sitting in my chest for months now.\n\nWe broke up. Life moved on. At least that's what I tell people. But the truth is, I never really stopped thinking about you. Not for a single day.\n\nI still remember things I shouldn't. The way you used to look at me when you were excited about something. The sound of your voice when you were half asleep. The way you said my name like it meant something. I remember all of it.\n\nI know we ended. I know there were reasons. I know you've probably moved on and maybe you don't even think about me anymore. And I'm not writing this to mess with your head or to try to drag you back into something you've already let go of.\n\nI'm writing this because I needed to be honest with myself first. And the truth is, I'm still obsessed with you.\n\nNot in a creepy way. Not in a way that means I can't function without you. But in a way that means you set a standard that nobody else has come close to. In a way that means I compare everyone to a ghost. In a way that means even months later, you still cross my mind more than anyone should.\n\nI'm not asking for another chance. I'm not asking for anything really. I just wanted you to know that you weren't just another relationship to me. You weren't just someone I dated. You were someone who actually meant something. And losing you left a mark that hasn't faded.\n\nIf you ever read this, I hope you smile. I hope you're doing well. I hope life has been kind to you. And I hope you know that someone out there still thinks the world of you. Even from a distance. Even anonymously. Even now.\n\nTake care of yourself, Favour. You deserve everything good.\n\nAlways,\nSomeone who never forgot you",ga:["https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1493723843671-1d655e66ac1c?w=400&h=500&fit=crop","https://images.unsplash.com/photo
