const D={j:{n:"Jasmine",av:"❀",st:"Someone who truly matters",hm:"Welcome, Jasmine. A universe built just for you.",me:[{t:"We Laughed Until We Cried",d:"Still makes me smile",i:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&h=300&fit=crop",c:"Pure gold."},{t:"Late Night Conversations",d:"Time didn't matter",i:"https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=400&h=300&fit=crop",c:"Everything and nothing."}],lt:"For You, Jasmine",lc:`Dear Jasmine,\n\nYou make people feel seen. Remembering details others forget, showing up when it matters. That's rare.\n\nThis bond matters. Trust, laughter, understanding.\n\nThank you for being you.\n\nWith appreciation,\nSomeone who values you`,ga:["https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&h=500&fit=crop"],so:[{t:"She Goes By",a:"Special Song"}],sm:"Jasmine, you make the world softer. Never forget how much you matter."},e:{n:"Ella",av:"🌙",st:"Worth every second of waiting",hm:"A secret place, Ella. No pressure. Just someone who sees you.",me:[{t:"First Time We Talked",d:"You were different",i:"https://images.unsplash.com/photo-1514315384763-ba401779410f?w=400&h=300&fit=crop",c:"Some people stand out."},{t:"Your Smile",d:"Even on hard days",i:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=300&fit=crop",c:"You still smile."}],lt:"For You, Ella",lc:`Dear Ella,\n\nI'm not here to rush you. Just here. Patiently.\n\nHealing isn't linear. That's okay.\n\nTake your time. No pressure.\n\nWhenever you're ready, I'll be here.\n\nYours patiently,\nSomeone who sees your worth`,ga:["https://images.unsplash.com/photo-1514315384763-ba401779410f?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&h=500&fit=crop"],so:[{t:"Patient Heart",a:"For Ella"}],sm:"Ella, healing isn't linear. Take your time. I care. No pressure. Ever."},p:{n:"My Princess",av:"👑",avImg:"https://cdn.kord.live/serve/dvYw2S5YqKjC.jpg",st:"Worth crossing any distance for",hm:"You said show you. Here it is. A universe built for you.",me:[{t:"First Time I Saw You",d:"I just knew",i:"https://cdn.kord.live/serve/dvYw2S5YqKjC.jpg",c:"Your face stayed."},{t:"Song I Sang For You",d:"Every word real",i:"https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=300&fit=crop",c:"Words weren't enough."}],lt:"The Letter",lc:`To My Princess,\n\nYou said show you I really want you. So here it is. A whole universe. For you.\n\nYou're worth every mile. Every call. Every song.\n\nI don't just want a girlfriend. I want you.\n\nBe my girlfriend? Not because I asked. Because I proved it.\n\nYours,\nThe one who sang for you`,ga:["https://cdn.kord.live/serve/dvYw2S5YqKjC.jpg","https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400&h=500&fit=crop"],so:[{t:"Song I Sang For You",a:"Every word for you",url:"https://cdn.kord.live/serve/YlGrqoBsczBb.opus"}],sm:"You're why I built this. Why I sang. Be my princess. For real. Always."},w:{n:"My Wifey",av:"💍",avImg:"https://files.catbox.moe/gj8or3.jpeg",avGlow:"0 0 40px rgba(255,215,0,0.4)",st:"She said yes. The universe shifted.",hm:"<span class='wbadge'>💍 Husband</span> <span class='wbadge'>💍 Wifey</span><br><br>You already call me husband. I already call you wifey. This is our world. No regrets, just us.",me:[{t:"When You Said Yes",d:"Everything changed",i:"https://files.catbox.moe/gj8or3.jpeg",c:"You didn't just say yes to me. You said yes to us."},{t:"The Way You Call Me Husband",d:"And I call you wifey",i:"https://files.catbox.moe/aez7zy.jpeg",c:"Every time you say it, I know I made the right choice."},{t:"Your Laugh",d:"The sound I want forever",i:"https://files.catbox.moe/8x858e.jpeg",c:"If I could bottle one sound, it would be that."},{t:"Us Against Everything",d:"No looking back",i:"https://files.catbox.moe/fzjt9z.jpeg",c:"You and me. That's the plan. That's the whole plan."}],lt:"To My Wifey",lc:`My wifey,\n\nYou called me husband before I even asked. And when I did ask, you said yes like you'd been waiting for me to catch up. That energy, I'm never letting go.\n\nYou're not going to regret this. Not today, not years from now. I chose you because of how you make me feel. Seen. Wanted. At home.\n\nYour texts, your voice, the way you say my name. It all hits different with you.\n\nI think about the future more now. You're in every version of it. Not because I'm planning too far ahead, but because I can't picture one without you.\n\nThis is mutual. This is real. Husband and wifey against whatever comes. You'll never wonder if you made the right choice.\n\nYou did. We did.\n\nForever your husband,\nRem`,ga:["https://files.catbox.moe/gj8or3.jpeg","https://files.catbox.moe/aez7zy.jpeg","https://files.catbox.moe/8x858e.jpeg","https://files.catbox.moe/fzjt9z.jpeg"],so:[{t:"Song I Sang For My Wifey",a:"Every note is yours",url:"https://files.catbox.moe/o5q5qx.mp4",vid:true}],sm:"Wifey. You said yes. You call me husband. I meant every word. You're not going to regret this. Not ever. I've got you. Always."},s:{n:"Shammah",av:"✝️",st:"A queen with heaven's glow",hm:"<span class='wbadge'>👑 Shammah</span><br><br>You're different. You carry yourself like you know whose you are. And that's exactly why I can't stop thinking about you.",me:[{t:"The First Time I Noticed You",d:"Real recognizes real",i:"https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=300&fit=crop",c:"You stood out. Not because you were trying to. Because you couldn't help it."},{t:"Your Faith",d:"The most attractive thing about you",i:"https://images.unsplash.com/photo-1504052432859-70e60d1b6a72?w=400&h=300&fit=crop",c:"A woman who loves God first. That's rare. That's priceless."},{t:"The Way You Talk",d:"Grace in every word",i:"https://images.unsplash.com/photo-1493723843671-1d655e66ac1c?w=400&h=300&fit=crop",c:"You speak with wisdom most people twice your age haven't found yet."},{t:"That Smile Though",d:"Yeah, that one",i:"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=300&fit=crop",c:"Don't even get me started. Just keep smiling like that."}],lt:"A Letter For Shammah",lc:`Shammah,\n\nI'm going to be straight with you because you deserve that. No games, no gimmicks, no long paragraphs that say nothing. Just honesty.\n\nI like you. I've liked you for a minute now and I can't keep pretending it's just casual or friendly. It's not. Every time I see you, every time your name pops up, every time you laugh at something dumb I said, something in me just clicks. Like, yeah, this one right here.\n\nYou're not like most girls I've met. And I don't say that as a line. I say it because I see the way you carry yourself. You walk different when you know your worth. You talk different when you know who made you. There's a peace around you that doesn't come from this world and honestly, that's the most attractive thing about you.\n\nI know you probably have your guard up. I respect that. A woman like you should be protected, should be pursued properly, should be prayed over and not just chased after. I'm not trying to skip any steps or rush you into anything. I'm just trying to be honest about what I feel and what I want.\n\nWhat I want is a chance. Not to prove myself because I think you should just watch and see. Actions speak louder than words and I'd rather show you who I am over time than tell you who I am in one conversation.\n\nBut if you're asking what I see when I look at you, here it is.\n\nI see someone who puts God first and that alone sets you apart from everyone else. I see someone who knows how to carry herself with grace and strength at the same time. I see someone who's been through things and came out glowing, not bitter. I see someone who deserves a love that's patient, kind, and real. The kind of love the Bible talks about in 1 Corinthians 13. Not the watered down version. The real thing.\n\nI want to get to know you properly. Not just the surface stuff everyone sees. I want to know what makes you laugh when no one's watching. What songs you play when you're in your feelings. What verses you go back to when life gets heavy. What dreams you've whispered to God in private that you haven't told anyone else yet.\n\nI want to be someone you can trust. Someone who adds to your peace, not takes from it. Someone who pushes you closer to God, not further away. Someone who sees the queen in you and treats you accordingly.\n\nI know I'm not perfect. I've got my own things I'm working on. But I know what I want and I'm not afraid to go after it the right way.\n\nSo here I am, Shammah. Not with a fancy speech or a grand gesture. Just with honesty and a genuine heart. I'm asking you to give me a chance. One chance to show you that this isn't just talk. One chance to prove that I see you differently because you ARE different.\n\nAnd if you say yes, I promise you this. I will never make you regret it. I will respect you, protect your heart, honor your boundaries, and always point you back to the One who made you. Because a woman who loves God deserves a man who understands that she belongs to Him first.\n\nYou don't have to answer right now. Take your time. Pray about it. Think about it. I'm not going anywhere.\n\nBut when you're ready, I'm here. And I'm serious about you.\n\nWith all sincerity,\nSomeone who sees your worth and isn't afraid to wait`,ga:["https://images.unsplash.com/photo-1518609875373-06c3df3d27db?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1504052432859-70e60d1b6a72?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1493723843671-1d655e66ac1c?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=500&fit=crop"],so:[{t:"For Shammah",a:"A song in my heart"},{t:"Worth the Wait",a:"Patience and faith"},{t:"Heaven Sent",a:"That's what you are"}],sm:"Shammah. Proverbs 31:10 says a wife of noble character is worth more than rubies. You're worth more than that. I see you. I'm serious about you. And I'll wait as long as it takes."}};
