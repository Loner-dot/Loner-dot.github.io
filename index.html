<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Private Universe</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Georgia,serif;background:#0a0a0a;color:#fff;overflow-x:hidden;min-height:100vh}.p{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}.pt{position:absolute;background:rgba(255,182,193,0.6);border-radius:50%;animation:f 6s infinite ease-in-out}@keyframes f{0%,100%{transform:translateY(0)translateX(0);opacity:.3}25%{transform:translateY(-20px)translateX(10px);opacity:.6}50%{transform:translateY(-10px)translateX(-10px);opacity:.3}75%{transform:translateY(-30px)translateX(5px);opacity:.5}}.g{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px}.gp{background:rgba(255,182,193,0.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,182,193,0.2);border-radius:20px}#ls{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:100;background:#000}.lb{padding:30px 20px;width:90%;max-width:400px;text-align:center}.lt{font-size:2.5rem;background:linear-gradient(135deg,#ff69b4,#ff1493);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}.lsu{color:rgba(255,182,193,0.6);font-size:.9rem;margin-bottom:30px}.pi{width:100%;padding:15px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,182,193,0.2);border-radius:15px;color:#fff;font-size:1rem;outline:none;margin-bottom:20px}.pi:focus{border-color:rgba(255,182,193,0.6);box-shadow:0 0 20px rgba(255,182,193,0.2)}.lbtn{width:100%;padding:15px;background:linear-gradient(135deg,#ff69b4,#ff1493);border:none;border-radius:15px;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer}.lbtn:active{transform:scale(0.98)}.err{color:#ff6b6b;font-size:.85rem;margin-top:10px;display:none}#ap{display:none;position:relative;z-index:1;padding-bottom:100px}.nv{position:fixed;bottom:20px;left:20px;right:20px;z-index:50;padding:15px;display:flex;justify-content:space-around;overflow-x:auto}.ni{display:flex;flex-direction:column;align-items:center;gap:5px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:.7rem;white-space:nowrap;padding:5px 10px}.ni.ac{color:#ff69b4}.nic{font-size:1.5rem}.pg{display:none;padding:20px;min-height:100vh;animation:fi .5s ease}.pg.ac{display:block}@keyframes fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.hc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}.av{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#ff69b4,#ff1493);display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:20px;animation:f 4s ease-in-out infinite;box-shadow:0 0 40px rgba(255,105,180,0.3)}.pn{font-size:2.5rem;background:linear-gradient(135deg,#ff69b4,#ffb6c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}.ps{color:rgba(255,182,193,0.6);font-size:1.1rem;margin-bottom:30px}.mc{background:rgba(255,182,193,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,182,193,0.2);border-radius:20px;overflow:hidden;margin-bottom:20px}.mc:active{transform:scale(0.98)}.mi{width:100%;height:200px;object-fit:cover}.min{padding:20px}.mt{font-size:1.2rem;color:#ffb6c1;margin-bottom:5px}.md{color:rgba(255,182,193,0.4);font-size:.85rem;margin-bottom:10px}.mca{color:rgba(255,255,255,0.7);font-size:.95rem;line-height:1.5}.lc{background:rgba(255,182,193,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,182,193,0.2);border-radius:20px;padding:30px 20px;line-height:1.8;color:rgba(255,255,255,0.8);white-space:pre-line}.lct{font-size:2rem;text-align:center;background:linear-gradient(135deg,#ff69b4,#ffb6c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gi{aspect-ratio:3/4;border-radius:15px;overflow:hidden;cursor:pointer}.gi img{width:100%;height:100%;object-fit:cover}.gi:active img{transform:scale(1.1)}.lbx{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:200;align-items:center;justify-content:center}.lbx.ac{display:flex}.lbx img{max-width:90%;max-height:90vh;border-radius:15px}.mp{position:fixed;bottom:120px;right:20px;z-index:60;padding:10px}.mb{width:50px;height:50px;border-radius:50%;background:rgba(255,105,180,0.2);border:1px solid rgba(255,105,180,0.3);color:#ffb6c1;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.mb:active{transform:scale(0.95)}.sc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}.ss{font-size:4rem;animation:f 3s ease-in-out infinite;cursor:pointer;margin-bottom:30px}.sm{display:none;background:rgba(255,182,193,0.1);backdrop-filter:blur(20px);border:1px solid rgba(255,182,193,0.2);border-radius:20px;padding:30px;font-size:1.1rem;color:rgba(255,255,255,0.8);line-height:1.6}.sm.rv{display:block;animation:fi .5s ease}.lo{position:fixed;top:20px;right:20px;z-index:60;padding:10px 20px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:25px;color:rgba(255,255,255,0.7);font-size:.85rem;cursor:pointer;backdrop-filter:blur(10px)}.lo:active{background:rgba(255,0,0,0.2)}.ptt{font-size:2rem;text-align:center;background:linear-gradient(135deg,#ff69b4,#ffb6c1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px;padding-top:60px}.ld{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:300}.ldt{font-size:1.5rem;color:#ff69b4;animation:pl 1.5s infinite}@keyframes pl{0%,100%{opacity:.5}50%{opacity:1}}
</style></head><body>
<div class="ld" id="ld"><div class="ldt">✦</div></div><div class="p" id="pt"></div>
<div id="ls"><div class="lb gp"><h1 class="lt">Private Universe</h1><p class="lsu">A hidden world awaits</p><input type="password" id="pw" class="pi" placeholder="Enter your key..." autocomplete="off"><button class="lbtn" onclick="L()">Enter Universe</button><p class="err" id="er">This universe is not for you...</p></div></div>
<div id="ap"><button class="lo" onclick="LO()">✕</button>
<div class="pg ac" id="hp"><div class="hc"><div class="av" id="av">❀</div><h1 class="pn" id="pn"></h1><p class="ps" id="ps"></p><div class="gp" style="padding:20px;max-width:350px"><p style="color:rgba(255,255,255,0.7);line-height:1.6" id="hm"></p></div></div></div>
<div class="pg" id="mpg"><h2 class="ptt">Precious Moments</h2><div id="mct"></div></div>
<div class="pg" id="lp"><h2 class="lct" id="lt"></h2><div class="lc" id="lct"></div></div>
<div class="pg" id="gp"><h2 class="ptt">Visual Memories</h2><div class="gg" id="gct"></div></div>
<div class="pg" id="mup"><h2 class="ptt">Our Soundtrack</h2><div id="sct"></div></div>
<div class="pg" id="sp"><div class="sc"><div class="ss" onclick="RS()">✧</div><p style="color:rgba(255,182,193,0.5)" id="sh">Some messages are meant to be discovered...<br><small>(tap the star)</small></p><div class="sm" id="sm"></div></div></div>
<div class="lbx" id="lbx" onclick="CL()"><img id="lbi" src="" alt=""></div>
<div class="mp g"><button class="mb" onclick="TM()" id="mb">▶</button></div>
<nav class="nv g"><a href="#" class="ni ac" onclick="SP('h')"><span class="nic">✦</span>Home</a><a href="#" class="ni" onclick="SP('m')"><span class="nic">❀</span>Memories</a><a href="#" class="ni" onclick="SP('l')"><span class="nic">♥</span>Letter</a><a href="#" class="ni" onclick="SP('g')"><span class="nic">◈</span>Gallery</a><a href="#" class="ni" onclick="SP('mu')"><span class="nic">♪</span>Music</a><a href="#" class="ni" onclick="SP('s')"><span class="nic">⚝</span>Secret</a></nav></div>
<script>
const JP="jasmine123",EP="ella123";
const P={j:{n:"Jasmine",av:"❀",st:"Someone who truly matters",hm:"Welcome to your space, Jasmine. This is a small universe built just for you — filled with warmth, comfort, and appreciation for everything you are.",me:[{t:"The Day We Laughed Until We Cried",d:"A memory that still makes me smile",i:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&h=300&fit=crop",c:"Some moments are pure gold — this was one of them."},{t:"Late Night Conversations",d:"When time didn't matter",i:"https://images.unsplash.com/photo-1474552226712-ac0f0961a954?w=400&h=300&fit=crop",c:"Talking about everything and nothing at the same time."},{t:"Your Random Acts of Kindness",d:"Small things that meant everything",i:"https://images.unsplash.com/photo-1487546331507-fcf8a09d3453?w=400&h=300&fit=crop",c:"You make the world softer just by being in it."},{t:"That Time You Surprised Everyone",d:"Unexpected magic",i:"https://images.unsplash.com/photo-1518895949257-7621c3fb6e22?w=400&h=300&fit=crop",c:"Watching you shine is one of my favorite things."}],lt:"A Letter for You, Jasmine",lc:`Dear Jasmine,\n\nI wanted to create something that captures even a fraction of what you mean. This isn't just a website — it's a small attempt to reflect back the warmth you bring into every room you enter.\n\nYou have this quiet way of making people feel seen — the way you remember details others forget, how you show up when it matters most, the genuine care that radiates from everything you do. That's rare. That's you.\n\nWhat I appreciate most is the consistency of your presence. You're steady in a world that often isn't. You're genuine when pretense would be easier.\n\nThis bond we share — it matters. It's built on trust, laughter, understanding, and countless small moments that add up to something irreplaceable.\n\nThank you for being exactly who you are. The world is better with you in it.\n\nWith so much appreciation,\nSomeone who truly values you`,ga:["https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1502823403499-6ccfcf4fb453?w=400&h=500&fit=crop"],so:[{t:"She Goes By",a:"Special Song",du:"3:45"},{t:"Soft Melody",a:"For You",du:"4:20"},{t:"Warm Night",a:"Ambient",du:"3:30"}],sm:"Jasmine, you are the kind of person who makes the world feel softer, kinder, and infinitely more beautiful just by being in it. Never forget how much you matter."},e:{n:"Ella",av:"🌙",st:"Made for someone unforgettable",hm:"You've stumbled into a secret world, Ella. A place that exists only because you do — mysterious, cinematic, and waiting to be explored.",me:[{t:"The First Time I Noticed You",d:"Something shifted",i:"https://images.unsplash.com/photo-1514315384763-ba401779410f?w=400&h=300&fit=crop",c:"There are moments that change everything. This was one of them."},{t:"Your Mysterious Energy",d:"Intriguing and unforgettable",i:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=300&fit=crop",c:"Some people are like books you can't put down."},{t:"A Glimpse of Your World",d:"Fascinating and beautiful",i:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&h=300&fit=crop",c:"Every detail about you makes me want to know more."},{t:"The Way You Move Through Life",d:"Effortlessly captivating",i:"https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=400&h=300&fit=crop",c:"There's something magnetic about the way you exist."}],lt:"Something I Wanted to Tell You, Ella",lc:`Dear Ella,\n\nI don't quite know how to explain this, but meeting you felt... different. Not dramatic, but a quiet, subtle shift that I'm still trying to understand.\n\nThere's something about you that lingers. The way you carry yourself, the energy you bring into spaces — I notice them.\n\nI find myself curious about you. Not just surface-level, but genuine wonder about who you are beneath everything.\n\nYou have this energy — mysterious and captivating. But it's not just mystery. There's depth. Layers I'd genuinely like to explore.\n\nI'd like to know you more. At whatever pace feels right. Some people are just worth the curiosity.\n\nYou're one of those people, Ella. Unforgettable. Worth discovering.\n\nAlways,\nSomeone who sees you differently`,ga:["https://images.unsplash.com/photo-1514315384763-ba401779410f?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&h=500&fit=crop","https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=400&h=500&fit=crop"],so:[{t:"She Goes By",a:"Special Song",du:"3:45"},{t:"Crimson Night",a:"Mysterious",du:"4:10"},{t:"Hidden Depths",a:"Ambient",du:"3:55"}],sm:"Ella, there's something about you that I can't quite put into words — a mystery I find myself wanting to unravel, a story I'd love to be part of. You're unforgettable."}};
let cp=null,ip=false,au=null;
function CP(){const c=document.getElementById('pt');for(let i=0;i<30;i++){const p=document.createElement('div');p.className='pt';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.width=Math.random()*4+2+'px';p.style.height=p.style.width;p.style.animationDelay=Math.random()*6+'s';p.style.animationDuration=Math.random()*4+4+'s';c.appendChild(p)}}
function L(){const pw=document.getElementById('pw').value;if(pw===JP){cp='j';SA()}else if(pw===EP){cp='e';SA()}else{const er=document.getElementById('er');er.style.display='block';setTimeout(()=>{er.style.display='none'},2000)}}
function SA(){document.getElementById('ls').style.display='none';document.getElementById('ap').style.display='block';sessionStorage.setItem('lp',cp);LP();setTimeout(()=>{document.getElementById('ld').style.display='none'},1000)}
function LP(){const p=P[cp];document.getElementById('pn').textContent=p.n;document.getElementById('ps').textContent=p.st;document.getElementById('hm').textContent=p.hm;document.getElementById('av').textContent=p.av;document.getElementById('mct').innerHTML=p.me.map(m=>`<div class="mc"><img src="${m.i}" class="mi"><div class="min"><h3 class="mt">${m.t}</h3><p class="md">${m.d}</p><p class="mca">${m.c}</p></div></div>`).join('');document.getElementById('lt').textContent=p.lt;document.getElementById('lct').textContent=p.lc;document.getElementById('gct').innerHTML=p.ga.map(i=>`<div class="gi" onclick="OL('${i}')"><img src="${i}"></div>`).join('');document.getElementById('sct').innerHTML=p.so.map(s=>`<div class="mc" style="display:flex;align-items:center;padding:15px"><div style="font-size:2rem;margin-right:15px">♪</div><div style="flex:1"><h3 style="color:#ffb6c1">${s.t}</h3><p style="color:rgba(255,182,193,0.4)">${s.a}</p></div><span style="color:rgba(255,182,193,0.3)">${s.du}</span></div>`).join('');document.getElementById('sm').textContent=p.sm}
function SP(n){const m={h:'hp',m:'mpg',l:'lp',g:'gp',mu:'mup',s:'sp'};document.querySelectorAll('.pg').forEach(p=>p.classList.remove('ac'));document.getElementById(m[n]).classList.add('ac');document.querySelectorAll('.ni').forEach(i=>i.classList.remove('ac'));event.target.closest('.ni').classList.add('ac');window.scrollTo(0,0)}
function OL(s){document.getElementById('lbi').src=s;document.getElementById('lbx').classList.add('ac')}
function CL(){document.getElementById('lbx').classList.remove('ac')}
function RS(){document.getElementById('sm').classList.add('rv');document.getElementById('sh').style.display='none'}
function TM(){if(!au){au=new Audio();au.loop=true}if(ip){au.pause();document.getElementById('mb').textContent='▶'}else{au.play().catch(()=>{});document.getElementById('mb').textContent='⏸'}ip=!ip}
function LO(){sessionStorage.removeItem('lp');cp=null;document.getElementById('ap').style.display='none';document.getElementById('ls').style.display='flex';document.getElementById('pw').value='';if(au){au.pause();ip=false;document.getElementById('mb').textContent='▶'}document.getElementById('sm').classList.remove('rv');document.getElementById('sh').style.display='block';document.querySelectorAll('.pg').forEach(p=>p.classList.remove('ac'));document.getElementById('hp').classList.add('ac')}
function CS(){const s=sessionStorage.getItem('lp');if(s&&P[s]){cp=s;document.getElementById('ls').style.display='none';document.getElementById('ap').style.display='block';LP();setTimeout(()=>{document.getElementById('ld').style.display='none'},1000)}else{document.getElementById('ld').style.display='none'}}
document.getElementById('pw').addEventListener('keypress',function(e){if(e.key==='Enter')L()});
CP();CS();
</script></body></html>
